model:
  name: isolation_forest
  threshold: 0.5

api:
  host: 0.0.0.0
  port: 8001


agents:
  llm_enabled:  false       # false = deterministic rules only. true = crewAI agents use the LLM
  llm_provider: gemini 
  # LLM_MODEL=gemini/gemini-flash-lite-latest
  llm_temperature: 0.0
  llm_timeout_s: 30
  llm_agents: diagnosis,supervisor     
  specialist_engine: direct             # direct = 1 LLM call per agent (fast) | crewai = tool loop (slow)
  ml_validated: false                   # true only after the ML model passes the NEW-recording test
  telemetry_channels: ""               
  default_asset_id: esp32-conveyor-01   

  evidence_window_minutes: 5
  min_confidence: 0.55       
  min_margin: 0.15          
  push_result_to_backend: false


  backend_mode: mock
  network_mode: mock
  anomaly_mode: inline       
